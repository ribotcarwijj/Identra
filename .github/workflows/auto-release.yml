name: Auto release (build + sign + publish)

# Run from the Actions tab ("Run workflow") or by pushing a tag like v0.7.40.
# Builds a release APK signed with the key in the repo secrets and publishes it as a
# GitHub Release, which the in-app updater reads.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64   base64 of the signing keystore (.jks)
#   KEYSTORE_PASSWORD keystore password
#   KEY_ALIAS         key alias
#   KEY_PASSWORD      key password
on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Check secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/KEYSTORE.JKS"
      - name: SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null || true
      - run: python3 tools/gen_found_index.py
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/Identra-v*.apk | head -1)
          VER=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          CODE=$(grep -m1 'versionCode' app/build.gradle | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          OUT="Identra-v$VER-$CODE.apk"
          cp "$APK" "$OUT"
          NOTES="release-notes/$VER.md"; [ -f "$NOTES" ] || { echo "Identra $VER" > /tmp/n.md; NOTES=/tmp/n.md; }
          if gh release view "v$VER" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VER" "$OUT" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "v$VER" "$OUT" -t "Identra $VER" -F "$NOTES" --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY"
          fi
      - name: Clean up keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/KEYSTORE.JKS"
